name: Dual Recovery Signed Cloud Builder

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - name: Checkout Local Repository Tree
      uses: actions/checkout@v4

    - name: Clean Environment and Maximize Storage Space
      run: |
        echo "=== Pre-cleanup Disk Status ==="
        df -h
        echo "=== Dropping Large Tooling Sets ==="
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        echo "=== Post-cleanup Disk Status ==="
        df -h

    - name: Install Architecture Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 openjdk-11-jdk cpio

    - name: Setup Google Repo Command Line Tool
      run: |
        mkdir -p ~/bin
        curl https://googleapis.com > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "PATH=$HOME/bin:$PATH" >> $GITHUB_ENV

    - name: Initialize Recovery Workspace Source Code Tree
      run: |
        export PATH=$HOME/bin:$PATH
        mkdir workspace
        cd workspace
        git config --global user.name "Dylan"
        git config --global user.email "rykenspops@gmail.com"
        
        # Switched to the official high-availability TWRP minimal manifest platform link
        repo init --depth=1 --no-repo-verify -u https://github.com -b twrp-12.1
        
        # Standard robust multi-threaded sync with automatic sequential fallback loop
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags || repo sync -c -j2 --force-sync --no-clone-bundle --no-tags

    - name: Inject Device Configurations and Private Signing Keys
      run: |
        mkdir -p workspace/device/blackview/shark6
        cp -r shark6_device/blackview/shark6/* workspace/device/blackview/shark6/

    - name: Compile Signed TWRP Recovery Target Image
      run: |
        export PATH=$HOME/bin:$PATH
        cd workspace
        . build/envsetup.sh
        lunch twrp_shark6-eng
        mka recoveryimage -j$(nproc --all)
        cp out/target/product/shark6/recovery.img ../twrp_signed_shark6.img
        make clean

    - name: Compile Signed OrangeFox Recovery Target Image
      run: |
        export PATH=$HOME/bin:$PATH
        cd workspace
        . build/envsetup.sh
        lunch fox_shark6-eng
        mka recoveryimage -j$(nproc --all)
        cp out/target/product/shark6/recovery.img ../orangefox_signed_shark6.img

    - name: Archive and Upload Signed Production Releases
      uses: actions/upload-artifact@v4
      with:
        name: Signed-Custom-Recoveries
        path: |
          twrp_signed_shark6.img
          orangefox_signed_shark6.img
